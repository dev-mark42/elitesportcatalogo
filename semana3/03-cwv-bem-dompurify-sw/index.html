<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Web Vitals, BEM y DOMPurify | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
<style>.tarjeta-bem{border:1px solid var(--border);border-radius:12px;padding:14px}.tarjeta-bem__titulo{font-size:1.1rem}.tarjeta-bem__titulo--destacado{color:var(--gtxt)}.tarjeta-bem__texto{color:var(--muted);margin:0}</style></head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Core Web Vitals, BEM y DOMPurify</h1><p class="t-m">Mide LCP/CLS/INP en vivo, sanea HTML con DOMPurify y usa nombres BEM.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<dl class="row"><dt class="col-3">LCP</dt><dd class="col-9" id="l">…</dd><dt class="col-3">CLS</dt><dd class="col-9" id="c">…</dd><dt class="col-3">INP</dt><dd class="col-9" id="i">…</dd></dl>
<label class="form-label" for="h">HTML no confiable</label><textarea id="h" class="form-control campo mb-2" rows="2">&lt;b&gt;Hola&lt;/b&gt;&lt;script&gt;alert(1)&lt;/script&gt;&lt;img src=x onerror=alert(2)&gt;</textarea>
<p class="mb-1">Sanitizado: <code id="s"></code></p><p>Solo texto: <code id="t"></code></p>
<article class="tarjeta-bem"><h2 class="tarjeta-bem__titulo tarjeta-bem__titulo--destacado">Tarjeta BEM</h2><p class="tarjeta-bem__texto">Bloque__elemento--modificador</p></article>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { medirCWV, veredicto } from './cwv.js';
import { sanitizarHTML, soloTexto } from './sanitizar.js';
medirCWV(m => { l.textContent = m.LCP == null ? '…' : m.LCP + ' ms · ' + veredicto.LCP(m.LCP); c.textContent = m.CLS + ' · ' + veredicto.CLS(m.CLS); i.textContent = m.INP == null ? 'interactúa con la página' : m.INP + ' ms · ' + veredicto.INP(m.INP); });
const h = document.getElementById('h'), s = document.getElementById('s'), t = document.getElementById('t');
const f = () => { s.textContent = sanitizarHTML(h.value); t.textContent = soloTexto(h.value); }; h.oninput = f; f();
</script>
</body>
</html>
