<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú hamburguesa | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Menú hamburguesa</h1><p class="t-m">Un botón real con aria-expanded abre y cierra el menú.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<button type="button" id="btn" class="btn btn-ghost" aria-controls="menu" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
<nav id="menu" aria-label="Menú de ejemplo" style="display:none" class="mt-3"><a class="d-block py-2" href="#">Inicio</a><a class="d-block py-2" href="#">Catálogo</a><a class="d-block py-2" href="#">Contacto</a></nav>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { activarHamburguesa } from './menu-hamburguesa.js';
const m = document.getElementById('menu'), b = document.getElementById('btn');
activarHamburguesa(b, m);
b.addEventListener('click', () => { m.style.display = m.classList.contains('abierto') ? 'block' : 'none'; });
</script>
</body>
</html>
