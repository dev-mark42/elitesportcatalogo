<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertas y confirmaciones | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Alertas y confirmaciones</h1><p class="t-m">Reemplazan a alert() y confirm() del navegador.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-neon" data-t="ok">Éxito</button><button type="button" class="btn btn-ghost" data-t="info">Info</button><button type="button" class="btn btn-ghost" data-t="warn">Aviso</button><button type="button" class="btn btn-outline-danger" data-t="error">Error</button><button type="button" class="btn btn-ghost" id="cf">Confirmar…</button></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { toast, confirmar } from './alertas.js';
document.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) toast('Mensaje de ' + b.dataset.t, b.dataset.t); });
document.getElementById('cf').onclick = async () => toast((await confirmar('¿Quieres continuar?')) ? 'Confirmado' : 'Cancelado', 'info');
</script>
</body>
</html>
