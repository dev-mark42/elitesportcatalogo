<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filtro del catálogo | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Filtro del catálogo</h1><p class="t-m">Función pura filtrarProductos(): búsqueda, liga, disponibilidad y orden.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<div class="row g-2 mb-3"><div class="col"><label class="form-label" for="q">Buscar</label><input id="q" class="form-control campo" placeholder="Real, City…"></div>
<div class="col-auto"><label class="form-label" for="o">Orden</label><select id="o" class="form-select campo"><option value="nuevo">Recientes</option><option value="precio-asc">Menor precio</option><option value="precio-desc">Mayor precio</option></select></div>
<div class="col-auto d-flex align-items-end"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="d"><label class="form-check-label" for="d">Solo disponibles</label></div></div></div>
<ul id="lista" class="list-group"></ul>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { filtrarProductos } from './filtro-catalogo.js';
const datos = [{id:1,titulo:'Real Madrid Local',precio:380,stock:12,liga:'laliga'},{id:2,titulo:'Barcelona Local',precio:380,stock:8,liga:'laliga'},{id:3,titulo:'Manchester City',precio:360,stock:5,liga:'premier'},{id:4,titulo:'Argentina Retro 86',precio:420,stock:0,liga:'argentina'}];
const $ = id => document.getElementById(id);
const pintar = () => { $('lista').innerHTML = filtrarProductos(datos, { q: $('q').value, orden: $('o').value, disp: $('d').checked }).map(p => `<li class="list-group-item d-flex justify-content-between"><span>${p.titulo}</span><b>Bs. ${p.precio}</b></li>`).join('') || '<li class="list-group-item">Sin resultados</li>'; };
['input','change'].forEach(e => document.addEventListener(e, pintar)); pintar();
</script>
</body>
</html>
