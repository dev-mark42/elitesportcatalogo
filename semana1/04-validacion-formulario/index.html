<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validación de formularios | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Validación de formularios</h1><p class="t-m">Mensajes visuales en vivo: obligatorio, mínimo, formato y rango.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<form id="f" novalidate><div class="mb-3"><label class="form-label" for="n">Nombre</label><input id="n" class="form-control campo"></div>
<div class="mb-3"><label class="form-label" for="c">Correo</label><input id="c" class="form-control campo" type="email"></div>
<div class="mb-3"><label class="form-label" for="p">Precio (1–9999)</label><input id="p" class="form-control campo" type="number"></div><button class="btn btn-neon">Validar</button></form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { validarFormulario, validacionEnVivo } from './validaciones.js';
const f = document.getElementById('f'), r = { n: { req: 1, min: 3 }, c: { req: 1, regex: /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, msg: 'Correo no válido' }, p: { req: 1, numMin: 1, numMax: 9999 } };
validacionEnVivo(f, r);
f.addEventListener('submit', e => { e.preventDefault(); if (validarFormulario(f, r)) alert('Formulario válido'); });
</script>
</body>
</html>
