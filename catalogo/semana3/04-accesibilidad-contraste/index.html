<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesibilidad y contraste WCAG | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../../semana3/04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Accesibilidad y contraste WCAG</h1><p class="t-m">Foco visible (:focus-visible), enlace de salto y modo de alto contraste.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">

    <button type="button" id="btnSimularContraste" class="btn btn-neon" aria-pressed="false">Simular alto contraste</button>

    <!-- 👇 BOTÓN DE ANIMACIONES AGREGADO AQUÍ 👇 -->
    <button type="button" id="btnAnimaciones" class="btn btn-ghost mt-2" aria-pressed="false">
        🔇 Animaciones: OFF
    </button>

    <div class="glass-card p-3 mt-3">
        <label class="form-label" for="x">Campo con etiqueta</label>
        <input id="x" class="form-control campo" placeholder="Pulsa Tab para ver el foco">
    </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { iniciarAltoContraste } from './accesibilidad.js';
import { iniciarControlAnimaciones } from '../../js/main.js'; // Importamos la función del main principal

iniciarAltoContraste(document.getElementById('btnSimularContraste'));

// Inicializamos el control de animaciones
// Asegúrate de que en tu main.js la función se exporte como 'export function iniciarControlAnimaciones'
// Si no, puedes copiar la lógica directamente aquí.

// Como es un archivo aislado, la forma más rápida es hacer que el botón funcione localmente:
document.getElementById('btnAnimaciones').addEventListener('click', () => {
    const body = document.body;
    const on = !body.classList.contains('animaciones-on');
    body.classList.toggle('animaciones-on', on);
    body.classList.toggle('animaciones-off', !on);
    localStorage.setItem('eliteAnimaciones', on ? '1' : '0');
    document.getElementById('btnAnimaciones').textContent = on ? '✨ Animaciones: ON' : '🔇 Animaciones: OFF';
});

// Al cargar, comprobar si estaban apagadas o encendidas
const guardado = localStorage.getItem('eliteAnimaciones');
const activadas = guardado === '1';
document.body.classList.toggle('animaciones-on', activadas);
document.body.classList.toggle('animaciones-off', !activadas);
document.getElementById('btnAnimaciones').textContent = activadas ? '✨ Animaciones: ON' : '🔇 Animaciones: OFF';
</script>
</body>
</html>
