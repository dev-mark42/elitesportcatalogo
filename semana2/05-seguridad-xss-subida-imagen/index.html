<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguridad XSS y subida de imágenes | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Seguridad XSS y subida de imágenes</h1><p class="t-m">limpiarTexto() neutraliza HTML malicioso; leerImagen() redimensiona imágenes locales.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<label class="form-label" for="t">Escribe &lt;img src=x onerror=alert(1)&gt;</label><input id="t" class="form-control campo mb-2"><div id="o" class="p-2 border rounded mb-4"></div>
<div class="dropzone" id="z" role="button" tabindex="0"><i class="fa-solid fa-cloud-arrow-up"></i><span>Toca para subir una imagen</span><input type="file" id="f" accept="image/*" class="d-none"></div><img id="v" alt="Vista previa de la imagen subida" class="mt-3" style="max-width:240px">
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { limpiarTexto } from './seguridad-xss.js';
import { leerImagen, activarDropzone } from './subida-imagen.js';
const t = document.getElementById('t'); t.oninput = () => { document.getElementById('o').innerHTML = limpiarTexto(t.value); };
activarDropzone(document.getElementById('z'), document.getElementById('f'), async f => { document.getElementById('v').src = await leerImagen(f, { max: 600 }); });
</script>
</body>
</html>
