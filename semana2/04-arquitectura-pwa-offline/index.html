<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquitectura PWA y modo offline | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Arquitectura PWA y modo offline</h1><p class="t-m">Estado de la conexión y cachés del Service Worker del proyecto.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<p>Conexión: <b id="e">…</b></p><button type="button" class="btn btn-ghost" id="b">Ver cachés</button><pre id="c" class="small mt-3"></pre>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { estaOnline, vigilarConexion, listarCache } from './offline.js';
const e = document.getElementById('e'); const p = on => { e.textContent = on ? 'En línea' : 'Sin conexión'; }; p(estaOnline()); vigilarConexion(p);
document.getElementById('b').onclick = async () => { document.getElementById('c').textContent = JSON.stringify(await listarCache(), null, 2) || '[]'; };
</script>
</body>
</html>
