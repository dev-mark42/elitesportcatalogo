<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrusel, zoom y animaciones | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Carrusel, zoom y animaciones</h1><p class="t-m">Carrusel con swipe/teclado, zoom tipo Mercado Libre y efectos.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<div id="hero" class="mb-4"></div>
<div style="display:flex;gap:16px;flex-wrap:wrap"><div class="zm-img" id="zmWrap" style="position:relative;width:300px;height:300px"><img id="zoomImg" alt="Imagen de ejemplo para ampliar" src="../../assets/img/logo.png" style="width:100%;height:100%;object-fit:contain"><div class="zm-lens" id="zmLens"></div><span class="zm-hint" id="zmHint"></span></div>
<div id="zmPane" style="width:300px;height:300px;border:1px solid var(--border);background-repeat:no-repeat;display:none"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { iniciarCarrusel } from './carrusel.js';
import { activarZoom } from './zoom.js';
import { inicializarAnimaciones } from './animaciones.js';
inicializarAnimaciones();
iniciarCarrusel(document.getElementById('hero'), [{ img: '', badge: 'NUEVO', titulo: 'Carrusel de ejemplo', texto: 'Usa flechas, teclado o desliza.' }, { img: '', badge: 'OFERTA', titulo: 'Segundo slide', texto: 'Con barra de progreso.' }]);
const w = id => document.getElementById(id); activarZoom({ wrap: w('zmWrap'), img: w('zoomImg'), lens: w('zmLens'), pane: w('zmPane'), hint: w('zmHint') });
</script>
</body>
</html>
