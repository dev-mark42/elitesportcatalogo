<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delegación de eventos e hidratación | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Delegación de eventos e hidratación</h1><p class="t-m">Un solo listener atiende botones creados después (event bubbling).</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<button type="button" id="add" class="btn btn-neon mb-3">Agregar ítem</button><ul id="lista" class="list-group"></ul><p class="t-m small mt-3" id="est">Hidratando…</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { configurarDelegacionEventos as deleg } from './delegacion-eventos.js';
import { iniciarHidratacion } from './hidratacion.js';
let n = 0; const l = document.getElementById('lista');
document.getElementById('add').onclick = () => l.insertAdjacentHTML('beforeend', `<li class="list-group-item d-flex justify-content-between">Ítem ${++n}<button type="button" class="btn btn-sm btn-outline-danger js-del" aria-label="Quitar ítem ${n}">Quitar</button></li>`);
deleg('#lista', '.js-del', 'click', (e, t) => t.closest('li').remove());
iniciarHidratacion(); setTimeout(() => { document.getElementById('est').textContent = document.body.classList.contains('hidratado') ? 'Interfaz hidratada ✔' : 'Hidratando…'; }, 900);
</script>
</body>
</html>
