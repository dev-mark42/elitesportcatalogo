<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetch, lazy loading y enlaces de Dropbox | Elite Sport</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/spa.css"><link rel="stylesheet" href="../04-accesibilidad-contraste/accesibilidad.css" onerror="this.remove()">
</head>
<body style="padding:24px 0">
<main class="container" style="max-width:820px" id="contenido-principal">
<header class="mb-4"><h1 class="display-font">Fetch, lazy loading y enlaces de Dropbox</h1><p class="t-m">Lee productos.json con fetch y carga las imágenes cuando entran en pantalla.</p><p class="small"><a href="../../index.html">← Volver al proyecto principal</a> · Este avance funciona solo y también está integrado en el proyecto.</p></header>
<section class="glass-card p-4">
<div class="mb-3"><label class="form-label" for="u">Enlace de Dropbox</label><input id="u" class="form-control campo" value="https://www.dropbox.com/scl/fi/abc/foto.jpg?rlkey=xyz&dl=0"><code id="r" class="small d-block mt-2"></code></div><ul id="lista" class="list-group"></ul>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { inicializarLazyLoading } from './lazy-loading.js';
import { normalizarImagen } from './dropbox.js';
const u = document.getElementById('u'), r = document.getElementById('r');
const mostrar = () => { r.textContent = normalizarImagen(u.value) || '(enlace no válido)'; }; u.oninput = mostrar; mostrar();
const datos = await (await fetch('../../assets/data/productos.json')).json();
document.getElementById('lista').innerHTML = datos.map(p => `<li class="list-group-item d-flex gap-3 align-items-center"><img data-src="../../assets/img/logo-128.png" alt="${p.titulo}" width="48" height="48"><span>${p.titulo}</span></li>`).join('');
inicializarLazyLoading();
</script>
</body>
</html>
